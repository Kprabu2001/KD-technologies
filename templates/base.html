{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}KD Technologies &mdash; Building the Digital Future{% endblock %}</title>
  <meta name="description" content="KD Technologies &mdash; Full Stack Python Developer building scalable REST APIs and responsive web apps using Django, FastAPI, React.js, and PostgreSQL." />
  <meta name="keywords" content="web development, website design, web application, KD Technologies, Django, FastAPI, React.js, Python, Full Stack Developer, Villupuram" />
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  {% block extra_css %}{% endblock %}
</head>
<body>

  <!-- Navigation Bar -->
  {% include 'includes/navbar.html' %}

  <!-- Main Content -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- Footer -->
  {% include 'includes/footer.html' %}

  <!-- Scripts -->
  <script src="{% static 'js/main.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
